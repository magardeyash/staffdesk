<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - StaffDesk'">Employee Form - StaffDesk</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .card {
            border: none;
            box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.05);
            border-radius: 0.75rem;
        }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top shadow-sm">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/employees}">
            <i class="bi bi-people-fill fs-4"></i>
            <span class="fw-bold">StaffDesk</span>
        </a>
    </div>
</nav>

<!-- Main Container -->
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-7 col-md-9">

            <!-- Card -->
            <div class="card shadow-sm">
                <div class="card-header bg-white py-3 border-bottom">
                    <div class="d-flex align-items-center justify-content-between">
                        <h4 class="mb-0 fw-bold text-secondary" th:text="${pageTitle}">
                            <i class="bi bi-person-fill-gear me-2 text-primary"></i>Employee Form
                        </h4>
                        <a th:href="@{/employees}" class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back to List
                        </a>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/employees/save}" th:object="${employee}" method="post" novalidate>

                        <!-- Hidden Field for ID (Preserves ID during edit / update) -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">
                                Full Name <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="name"
                                   th:field="*{name}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''"
                                   placeholder="e.g. John Doe">
                            <div th:if="${#fields.hasErrors('name')}"
                                 th:errors="*{name}"
                                 class="invalid-feedback">
                                Name error
                            </div>
                        </div>

                        <!-- Email Address -->
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">
                                Email Address <span class="text-danger">*</span>
                            </label>
                            <input type="email"
                                   id="email"
                                   th:field="*{email}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''"
                                   placeholder="e.g. john.doe@example.com">
                            <div th:if="${#fields.hasErrors('email')}"
                                 th:errors="*{email}"
                                 class="invalid-feedback">
                                Email error
                            </div>
                        </div>

                        <!-- Department -->
                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">
                                Department <span class="text-danger">*</span>
                            </label>
                            <input type="text"
                                   id="department"
                                   list="departmentOptions"
                                   th:field="*{department}"
                                   class="form-control"
                                   th:classappend="${#fields.hasErrors('department')} ? 'is-invalid' : ''"
                                   placeholder="Select or enter department">
                            <datalist id="departmentOptions">
                                <option value="Engineering"></option>
                                <option value="Human Resources"></option>
                                <option value="Marketing"></option>
                                <option value="Finance"></option>
                                <option value="Sales"></option>
                                <option value="Product"></option>
                                <option value="Operations"></option>
                            </datalist>
                            <div th:if="${#fields.hasErrors('department')}"
                                 th:errors="*{department}"
                                 class="invalid-feedback">
                                Department error
                            </div>
                        </div>

                        <!-- Salary -->
                        <div class="mb-4">
                            <label for="salary" class="form-label fw-semibold">
                                Annual Salary ($) <span class="text-danger">*</span>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number"
                                       id="salary"
                                       step="0.01"
                                       min="0"
                                       th:field="*{salary}"
                                       class="form-control"
                                       th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid' : ''"
                                       placeholder="e.g. 65000.00">
                                <div th:if="${#fields.hasErrors('salary')}"
                                     th:errors="*{salary}"
                                     class="invalid-feedback">
                                    Salary error
                                </div>
                            </div>
                            <div class="form-text">Must be a non-negative value (0.00 or higher).</div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2 justify-content-end pt-3 border-top">
                            <a th:href="@{/employees}" class="btn btn-outline-secondary px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4 fw-semibold">
                                <i class="bi bi-check-lg me-1"></i> Save Employee
                            </button>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
